name: deploy website
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
  pull-requests: write
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.ZEIT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.orgId }}
          vercel-project-id: ${{ secrets.projectId }}
          working-directory: ./
